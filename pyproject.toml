[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meechrtk"
version = "0.2.0"
description = "Safe context compression for AI agent tool output"
requires-python = ">=3.10"

[project.scripts]
meechrtk = "meechrtk.cli:main"

[tool.setuptools.packages.find]
include = ["meechrtk*"]
