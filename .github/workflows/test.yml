name: MeechRTK CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e . pytest
      - name: Tests
        run: pytest -q
      - name: Compile
        run: python -m compileall -q meechrtk
      - name: Validate Firefox manifest
        run: python - <<'PY'
import json
m=json.load(open('extension/manifest.json'))
assert m['manifest_version']==3
assert m['action']['default_popup']=='popup.html'
print('Firefox MV3 manifest OK')
PY
